services:
  mongo:
    image: mongo:7
    container_name: wanderlust-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: wanderlust-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wanderlust-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/wanderlust
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8080
      # JWT_SECRET, GOOGLE_CLIENT_ID etc. are loaded from ./backend/.env if present
      # Create it first: cp backend/.env.sample backend/.env and edit secrets
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_PATH: http://localhost:8080
    container_name: wanderlust-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
